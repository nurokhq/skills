[project]
name = "nurok-skills"
version = "0.1.0"
description = "Validation tooling for the Nurok Skills repository"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
  "pyyaml>=6.0.2,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
