name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --config lychee.toml ."
          fail: true
      - name: Lint Workflows
        uses: docker://rhysd/actionlint:1.7.12

  repository:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --locked
      - name: Validate Repository
        run: uv run python scripts/ci/validate_repository.py
      - name: Verify Skill Distribution
        if: github.event_name != 'pull_request'
        run: uv run python scripts/ci/verify_skill_distribution.py
      - name: Verify Skill Distribution And Versions
        if: github.event_name == 'pull_request'
        run: uv run python scripts/ci/verify_skill_distribution.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check Formatting
        run: uv run ruff format --check plugins packaging tests scripts
      - name: Lint
        run: uv run ruff check plugins packaging tests scripts
      - name: Test
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

  package:
    name: Plugin Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=0.1.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build And Verify Archive
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release/build_plugin.py --version "$PLUGIN_VERSION"
      - name: Upload Reviewable Package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nurok-plugin
          path: dist/nurok-*
          if-no-files-found: error

  ci-ok:
    name: CI OK
    needs: [docs, repository, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Jobs
        run: 'if [ "${{ needs.docs.result }}" != "success" ] || [ "${{ needs.repository.result }}" != "success" ] || [ "${{ needs.package.result }}" != "success" ]; then echo "A required job did not succeed"; exit 1; fi'

  release:
    name: Publish GitHub Release
    needs: [ci-ok, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nurok-plugin-release
      cancel-in-progress: false
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Verified Package
        uses: actions/download-artifact@v8.0.2
        with:
          name: nurok-plugin
          path: dist
      - name: Publish Changed Plugin
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.package.outputs.version }}
        run: bash scripts/release/publish_plugin.sh
